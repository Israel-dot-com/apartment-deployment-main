name: CD

on:
  push:
    branches: [ "main" ]

# Permission required to request the OIDC JWT token
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
        aws-region: us-east-1

    - name: Deploy via AWS Systems Manager
      run: |
        # Find the instance ID using the Name tag
        INSTANCE_ID=$(aws ec2 describe-instances \
          --filters "Name=tag:Name,Values=apartment-server" "Name=instance-state-name,Values=running" \
          --query "Reservations[*].Instances[*].InstanceId" \
          --output text)
          
        if [ -z "$INSTANCE_ID" ]; then
          echo "Error: Could not find a running EC2 instance tagged with Name=apartment-server"
          exit 1
        fi
        
        echo "Found Instance ID: $INSTANCE_ID"
        
        # Send SSM command to execute deploy.sh
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=["bash /home/ubuntu/apartment-deployment/deploy.sh"]' \
          --query "Command.CommandId" \
          --output text)
          
        echo "SSM Command ID: $COMMAND_ID"
        
        # Wait for the command to finish
        echo "Waiting for command to complete..."
        aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
        
        # Fetch the output
        echo "Deployment Output:"
        aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
        
        STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
        if [ "$STATUS" != "Success" ]; then
          echo "Error log:"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
          echo "Deployment failed with status: $STATUS"
          exit 1
        fi
        
        echo "Deployment completed successfully!"
